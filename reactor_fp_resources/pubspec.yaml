name: reactor_fp_resources
version: 0.0.1
publish_to: 'none'
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  core_resources:
    git:
      url: https://github.com/icarohs7/flutter-resources
      path: core_resources
  flutter:
    sdk: flutter
  value_notifier_resources:
    git:
      url: https://github.com/icarohs7/flutter-resources
      path: value_notifier_resources
dev_dependencies:
  dart_code_linter: ^4.3.0
  equatable: ^2.0.5
  flutter_test:
    sdk: flutter
  rxdart: ^0.27.7
  material_ui: any
flutter:
  uses-material-design: true
scripts:
  lint: dart run dart_code_linter:metrics analyze lib